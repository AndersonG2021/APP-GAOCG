<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAOCG App - Gestão Orçamentária dos Contratos de Gestão</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <!--
    "Novo visual" (sessão 2026-08-13) roda em PARALELO ao style.css acima,
    nunca no lugar dele (ver css/tema-novo.css) - só faz efeito com
    data-tema="novo" em <html>. Escolha entre "Atual"/"Novo" existiu como
    período de transição e foi removida (sessão 2026-08-14, pedido do
    usuário): data-tema="novo" agora é fixo, aplicado abaixo sem depender de
    preferência salva.
  -->
  <link rel="stylesheet" href="css/tema-novo.css" />
  <script>
    // data-tema="novo" precisa estar em <html> ANTES do parser chegar no
    // <body>, pra nunca piscar o visual antigo por uma fração de segundo -
    // por isso é um script síncrono aqui (não "defer" como os demais). Só o
    // modo de cor (claro/escuro/sistema) ainda é preferência do usuário,
    // salva em localStorage (ver js/tema.js).
    (function () {
      document.documentElement.setAttribute('data-tema', 'novo');
      try {
        var modoCor = localStorage.getItem('gaocg_tema_modo_cor') || 'sistema';
        if (modoCor !== 'sistema') document.documentElement.setAttribute('data-modo-cor', modoCor);
      } catch (e) { /* localStorage indisponível (modo privado etc.) - fica no modo sistema. */ }
    })();
  </script>
</head>
<body>

  <div id="sobreposicaoCarregando" class="oculto"><div class="spinner"></div></div>
  <div id="containerToasts"></div>

  <!-- TELA DE LOGIN -->
  <section id="telaLogin">
    <div class="cartao-login">
      <h1>GAOCG App</h1>
      <p class="subtitulo">Gerência Administrativa Orçamentária dos Contratos de Gestão</p>
      <form id="formLogin" novalidate>
        <div class="campo">
          <label for="loginUsuario">Usuário</label>
          <input id="loginUsuario" type="text" autocomplete="username" required />
        </div>
        <div class="campo">
          <label for="loginSenha">Senha</label>
          <input id="loginSenha" type="password" autocomplete="current-password" required />
        </div>
        <p id="loginErro" class="erro-campo oculto"></p>
        <button type="submit" class="botao primario" style="width:100%">Entrar</button>
      </form>
    </div>
  </section>

  <!-- APLICAÇÃO -->
  <div id="appShell" class="oculto">
    <aside id="barraLateral">
      <div class="logo">GAOCG App</div>
      <nav>
        <button data-tela="dashboard" class="ativo">Dashboard</button>
        <button data-tela="sof">SOF</button>
        <button data-tela="notasEmpenho">Notas de Empenho</button>
        <button data-tela="recibos">Recibos</button>
        <button data-tela="unidades">Unidades</button>
        <button data-tela="metasProcessos">Metas de Processos</button>
        <button data-tela="listas">Listas Personalizadas</button>
        <button data-tela="logAuditoria">Log de Auditoria</button>
        <button data-tela="sugestoes">Sugestões</button>
        <button data-tela="usuarios" class="somente-gerente oculto">Usuários</button>
      </nav>
    </aside>
    <div id="fundoMenuMobile" class="fundo-menu-mobile oculto"></div>

    <div id="areaPrincipal">
      <header id="barraTopo">
        <button type="button" id="btnMenuMobile" class="botao-icone oculto-desktop" aria-label="Abrir menu">☰</button>
        <div id="tituloTopo" style="font-weight:600;color:var(--azul-escuro)"></div>
        <div style="display:flex;align-items:center;gap:16px">
          <div id="temaControles"></div>
          <div class="usuario-info">
            <strong id="nomeUsuarioTopo"></strong>
            <span id="perfilUsuarioTopo"></span>
          </div>
          <button id="btnSair" class="botao">Sair</button>
        </div>
      </header>
      <main id="conteudo"></main>
    </div>
  </div>

  <!--
    MODAL GENÉRICO (reaproveitado por todas as telas) - sessão 2026-08-12:
    o conteúdo (.modal, com título/corpo/rodapé) passou a ser criado por JS
    (UI.abrirModal, js/app.js) em vez de fixo aqui, pra permitir minimizar um
    card editado (sai de dentro de #sobreposicaoModal, vai pra
    #areaModaisMinimizados, sem perder nenhum estado/listener) e reabri-lo
    depois pelo "dock" (#dockModais, canto inferior esquerdo).
  -->
  <div id="sobreposicaoModal" class="sobreposicao-modal oculto"></div>
  <div id="areaModaisMinimizados" class="oculto"></div>
  <div id="dockModais" class="dock-modais"></div>

  <!--
    defer: os 18 arquivos são baixados em PARALELO durante o parse do HTML e
    executados na ordem declarada, logo antes do DOMContentLoaded - em vez de
    um download bloqueante atrás do outro. A ordem entre eles continua
    garantida (é isso que `defer` promete), então as dependências de carga
    (App.init em js/app.js depende de todos os módulos anteriores já estarem
    definidos) seguem valendo. Nenhum módulo toca no DOM antes do parse
    terminar, então o listener de DOMContentLoaded em js/app.js continua sendo
    registrado a tempo.
  -->
  <script defer src="js/api.js"></script>
  <script defer src="js/cache-abas.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/unidades.js"></script>
  <script defer src="js/metas-processos.js"></script>
  <script defer src="js/listas.js"></script>
  <script defer src="js/usuarios.js"></script>
  <script defer src="js/edicao-simultanea.js"></script>
  <script defer src="js/sei-bridge.js"></script>
  <script defer src="js/sof.js"></script>
  <script defer src="js/notas-empenho.js"></script>
  <script defer src="js/recibos.js"></script>
  <script defer src="js/log-auditoria.js"></script>
  <script defer src="js/sugestoes.js"></script>
  <script defer src="js/relatorios.js"></script>
  <script defer src="js/dashboard.js"></script>
  <script defer src="js/tema.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
